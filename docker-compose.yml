services:
  notes-agent:
    build: .
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - NOTES_DB_PATH=/data/notes.db
    volumes:
      - notes_data:/data
    command: ["python", "-m", "notes_agent.cli"]

  notes-web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - NOTES_DB_PATH=/data/notes.db
      - PORT=5000
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-dev-only-change-me}
    volumes:
      - notes_data:/data
    command: ["python", "web_app.py"]

volumes:
  notes_data: